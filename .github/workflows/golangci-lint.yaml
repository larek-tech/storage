# .github/workflows/golangci-lint.yml
name: golangci-lint

on:
  push:
    branches: [ main, master ]
    paths:
      - 'postgres/**'
      - 'redis/**'
      - 'kafka/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'postgres/**'
      - 'redis/**'
      - 'kafka/**'

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [postgres, redis, kafka, kafka/integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ${{ matrix.module }}
          version: v2.11