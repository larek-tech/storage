name: kafka-integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  changes:
    name: detect kafka changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.kafka }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kafka:
              - 'kafka/**'

  integration:
    name: testcontainers
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            kafka/go.sum
            kafka/integration/go.sum

      - name: Verify docker is available
        run: docker version

      - name: Run kafka unit tests
        working-directory: kafka
        run: go test -race ./...

      - name: Run kafka integration tests
        working-directory: kafka/integration
        run: go test -race -timeout 10m ./...
